set -g base-index 1

set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g monitor-activity on

unbind C-b
bind-key C-a send-prefix
set-option -g prefix C-a

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mouse on

set-option -g allow-rename off

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set-option -sg escape-time 10

#set -g default-terminal "xterm-24bit"
#set -g terminal-overrides ',xterm-24bit:Tc'
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g status-bg colour187
set -g status-fg colour235
# Границы панелей: неактивные — приглушённый серый
set -g pane-border-style "fg=colour187"
# Активная панель — сплошная ярко-жёлтая рамка (заливка границы, без текста)
set -g pane-active-border-style "bg=colour11 fg=colour0"
set-option -g renumber-windows on

# --- Визуальное выделение окон в статус-баре ---
# Неактивные окна
set -g window-status-style "fg=colour235 bg=colour187"
# Активное окно — инверсия цветов + жирный
set -g window-status-current-style "fg=colour187 bg=colour23 bold"
# Подсветка окон с активностью ( monitor-activity on выше )
set -g window-status-activity-style "fg=colour1,bold"
# Формат: "индекс:имя" + флаг зума (Z), когда панель развёрнута на весь экран окна
set -g window-status-format " #I:#W#{?window_zoomed_flag,Z,} "
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,Z,} "
set -g window-status-separator ""
# Номер активного окна в правом углу + дата/время
set -g status-right-length 50
set -g status-right " #[bold]#S:#I #[default]| %H:%M "
